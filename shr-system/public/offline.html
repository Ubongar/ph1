<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHR Offline</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        width: min(440px, 100%);
        border: 1px solid #dbeafe;
        background: #ffffff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }

      .badge {
        display: inline-flex;
        padding: 4px 10px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        line-height: 1.55;
        color: #334155;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      a {
        border-radius: 10px;
        border: 1px solid #93c5fd;
        background: #eff6ff;
        color: #1d4ed8;
        padding: 9px 14px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover,
      a:hover {
        background: #dbeafe;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <span class="badge">Offline Mode</span>
        <h1>You are offline.</h1>
        <p>
          SHR could not reach the network. If you installed the app, cached pages can still work. Reconnect and retry to continue syncing data.
        </p>
        <div class="actions">
          <button type="button" onclick="window.location.reload()">Retry</button>
          <a href="/">Go to App Home</a>
        </div>
      </div>
    </div>
  </body>
</html>
